---
# Builds the delinea-mcp wheel/sdist and publishes it with PyPI trusted
# publishing (OIDC): no API token is stored in the repository.
#
# One-time setup on pypi.org (organization Delinea) and, optionally,
# test.pypi.org: a trusted publisher for owner DelineaXPM, repository
# delinea-mcp, workflow publish-pypi.yml, environment "pypi" (or "testpypi").
#
# Publishing to PyPI happens on a published GitHub release; mark it a
# pre-release with a PEP 440 version (e.g. v2.0.0rc1) to test the pipeline
# without regular users getting it. Manual runs only build and check unless
# a repository is chosen.
#
# The release must be published by a person (or with a PAT or GitHub App
# token): a release created with the workflow GITHUB_TOKEN, as
# release.yml's GoReleaser step does, does not trigger this workflow. For
# such a release, run this workflow manually from the release tag with
# repository "pypi".
name: publish-pypi
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository:
        description: Where to publish (none = build and check only)
        required: true
        default: none
        type: choice
        options:
          - none
          - testpypi
          - pypi
permissions:
  contents: read
jobs:
  build:
    name: build-distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      stable: ${{ steps.versions.outputs.stable }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      - name: check-versions-match
        id: versions
        # The plugin pins `uvx delinea-mcp==<version>`; a mismatch would ship
        # a plugin that launches a different server than this release.
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          pkg=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          plugin=$(jq -r .version plugins/delinea/.claude-plugin/plugin.json)
          pinned=$(jq -r '.mcpServers.delinea.args[-1]' plugins/delinea/.claude-plugin/plugin.json)
          echo "pyproject=$pkg plugin=$plugin pinned=$pinned"
          test "$pkg" = "$plugin"
          test "$pinned" = "delinea-mcp==$pkg"
          # Skills and docs quote the pinned version too.
          if grep -rhoE 'delinea-mcp==[0-9][^ `"]*' plugins/delinea docs \
            | grep -v "delinea-mcp==$pkg\$"; then
            echo "Stale delinea-mcp version pins above"; exit 1
          fi
          if [ "$EVENT_NAME" = "release" ]; then
            test "$RELEASE_TAG" = "v$pkg"
          fi
          echo "stable=$(uv run scripts/version_is_stable.py "$pkg")" >> "$GITHUB_OUTPUT"
      - name: build
        run: uv build
      - name: smoke-test-wheel
        run: uvx --from dist/*.whl delinea-mcp --help
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
  publish:
    name: publish-${{ github.event_name == 'release' && 'pypi' || inputs.repository }}
    needs: build
    if: github.event_name == 'release' || inputs.repository != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event_name == 'release' && 'pypi' || inputs.repository }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: ${{ (github.event_name == 'release' || inputs.repository == 'pypi') && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
  update-release-branch:
    # The Claude plugin directory tracks the `release/current` branch, so it
    # only sees plugin versions whose pinned delinea-mcp is already on PyPI.
    # Pre-release versions stay off it, including on manual runs. A plain
    # (non-force) push refuses to move the branch anywhere but forward.
    name: update-release-branch
    needs: [build, publish]
    if: needs.build.outputs.stable == 'true' && ((github.event_name == 'release' && !github.event.release.prerelease) || inputs.repository == 'pypi')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - run: git push origin "${GITHUB_SHA}:refs/heads/release/current"
