---
name: delinea-mcp-release
on:
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Type of release to create'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
          - prerelease
      pypi-repository:
        description: 'PyPI repository to publish to'
        required: false
        default: 'pypi'
        type: choice
        options:
          - pypi
          - testpypi
  workflow_call:
    inputs:
      release-type:
        description: 'Type of release to create'
        required: false
        default: 'auto'
        type: string
      pypi-repository:
        description: 'PyPI repository to publish to (pypi or testpypi)'
        required: false
        default: 'pypi'
        type: string
permissions:
  contents: write
  packages: write
  id-token: write
  pull-requests: read
env:
  DELINEA_DOCKER_REGISTRY: quay.io/delinea
  UV_CACHE_DIR: /tmp/.uv-cache-release
defaults:
  run:
    shell: bash
jobs:
  prepare-release-environment:
    name: release-env-setup
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      release-version: ${{ steps.version-detect.outputs.version }}
      pypi-version: ${{ steps.version-detect.outputs.pypi-version }}
      should-release: ${{ steps.version-detect.outputs.should-release }}
    steps:
      - name: repo-checkout-full-history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: aqua-binary-manager-setup
        uses: aquaproj/aqua-installer@5e54e5cee8a95ee2ce7c04cb993da6dfad13e59c # v3.1.2
        with:
          aqua_version: v2.53.9
          working_directory: .
          # TODO: Create aqua.yaml with goreleaser and other required binaries
      - name: uv-setup
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      - name: release-version-detection
        id: version-detect
        run: |
          VERSION="$(uv version --short)"
          {
            echo "version=v${VERSION}"
            echo "pypi-version=${VERSION}"
            echo "should-release=true"
          } >> "$GITHUB_OUTPUT"
  pypi-build:
    name: pypi-distribution-build
    needs: prepare-release-environment
    if: needs.prepare-release-environment.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: repo-checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: uv-python-setup
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      - name: python-runtime-install
        run: uv python install 3.13
      - name: python-distribution-build
        run: uv build
      - name: wheel-version-verification
        env:
          EXPECTED: ${{ needs.prepare-release-environment.outputs.pypi-version }}
        run: |
          WHEEL="$(ls dist/*.whl)"
          case "$WHEEL" in
            *"delinea_mcp-${EXPECTED}-"*) echo "wheel ${WHEEL} matches ${EXPECTED}" ;;
            *) echo "::error::wheel ${WHEEL} does not match version ${EXPECTED}"; exit 1 ;;
          esac
      - name: python-dist-upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-dist
          path: dist/
          retention-days: 7
          if-no-files-found: error
  pypi-publish:
    name: pypi-trusted-publish
    needs: [prepare-release-environment, pypi-build]
    if: needs.prepare-release-environment.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Trusted Publisher must be registered on PyPI (or TestPyPI) for this
    # repo, workflow filename release.yml, and environment name pypi (or testpypi).
    environment:
      name: ${{ inputs.pypi-repository }}
      url: ${{ inputs.pypi-repository == 'testpypi' && 'https://test.pypi.org/p/delinea-mcp' || 'https://pypi.org/p/delinea-mcp' }}
    permissions:
      id-token: write
    steps:
      - name: python-dist-download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-dist
          path: dist/
      - name: uv-python-setup
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      - name: pypi-trusted-publish
        env:
          UV_PUBLISH_URL: ${{ inputs.pypi-repository == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          # Skips files already uploaded so a re-run does not fail.
          UV_PUBLISH_CHECK_URL: ${{ inputs.pypi-repository == 'testpypi' && 'https://test.pypi.org/simple/' || 'https://pypi.org/simple/' }}
        run: uv publish --trusted-publishing always dist/*
  delinea-mcp-release-execution:
    name: goreleaser-python-release
    needs: prepare-release-environment
    if: needs.prepare-release-environment.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: repo-checkout-full-history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: aqua-toolchain-setup
        uses: aquaproj/aqua-installer@5e54e5cee8a95ee2ce7c04cb993da6dfad13e59c # v3.1.2
        with:
          aqua_version: v2.53.9
          working_directory: .
      - name: uv-python-setup
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          enable-cache: true
          cache-dependency-glob: 'requirements.txt'
      - name: python-runtime-install
        run: |
          uv python install 3.13
          uv sync --frozen
          uv pip list --format=json | jq '.[] | select(.name=="mcp") | .version'
      - name: docker-registry-auth-quay
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_DELINEA_USERNAME }}
          password: ${{ secrets.QUAY_DELINEA_TOKEN }}
          # TODO: Configure Quay.io registry credentials
      - name: docker-registry-auth-dockerhub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          # TODO: Configure Docker Hub registry credentials (optional)
      - name: delinea-pre-release-validation
        run: |
          # TODO: Add pre-release validation checks
          uv run pytest tests/ -x --tb=line -m "not integration"
          echo "✅ Pre-release validation completed"
      - name: goreleaser-release-execution
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --timeout=20m
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_ORG: ${{ env.DELINEA_DOCKER_REGISTRY }}
          QUAY_USERNAME: ${{ secrets.QUAY_DELINEA_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_DELINEA_TOKEN }}
          # TODO: Configure PyPI publishing
          # PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      - name: release-artifact-validation
        run: |
          # TODO: Add post-release artifact validation
          ls -la dist/
          echo "✅ Release artifacts validated"
      - name: release-notification-prep
        if: success()
        run: |
          echo "🚀 Delinea MCP release ${{ needs.prepare-release-environment.outputs.release-version }} completed successfully"
          # TODO: Add Slack/Teams notification logic
  release-verification:
    name: post-release-verification
    needs: [prepare-release-environment, delinea-mcp-release-execution]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: release-docker-image-test
        run: |
          # TODO: Add Docker image smoke test
          docker pull quay.io/delinea/delinea-mcp:${{ needs.prepare-release-environment.outputs.release-version }}
          echo "✅ Docker image verification completed"
      - name: release-github-validation
        run: |
          # TODO: Validate GitHub release was created properly
          echo "✅ GitHub release validation completed"
