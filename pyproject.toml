[project]
name = "delinea-mcp"
version = "2.0.0"
description = "MCP server for the Delinea Secret Server and Platform APIs"
readme = "README.md"
requires-python = "==3.15.2"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Delinea" }]
maintainers = [{ name = "Gal Diskin" }]
keywords = [
  "mcp",
  "delinea",
  "secret-server",
  "pam",
  "claude",
  "model-context-protocol",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "fastapi==0.136.1",
  "httpx==0.28.1",
  "httpx-sse==0.4.1",
  "joserfc==1.7.7",
  "mcp==2.2.0",
  "requests==2.33.1",
  "truststore==0.10.5",
  "uvicorn==0.37.0",
]

[project.urls]
Homepage = "https://github.com/DelineaXPM/delinea-mcp"
Documentation = "https://github.com/DelineaXPM/delinea-mcp#readme"
Issues = "https://github.com/DelineaXPM/delinea-mcp/issues"
Changelog = "https://github.com/DelineaXPM/delinea-mcp/blob/main/CHANGELOG.md"

[project.scripts]
delinea-mcp = "delinea_mcp.server:main"

[project.optional-dependencies]
strongdm = ["strongdm==17.8.0"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["delinea_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "/delinea_mcp",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/SECURITY.md",
]

[dependency-groups]
dev = ["pytest==9.0.3", "pytest-asyncio==1.3.0", "coverage==7.10.7"]
test = [
  "fastapi==0.136.1",
  "httpx==0.28.1",
  "httpx-sse==0.4.1",
  "joserfc==1.7.7",
  "mcp==2.2.0",
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "requests==2.33.1",
  "truststore==0.10.5",
]
