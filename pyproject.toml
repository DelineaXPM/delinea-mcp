[project]
name = "delinea-mcp"
version = "1.1.0"
description = "MCP server for the Delinea Secret Server and Platform APIs"
readme = "README.md"
requires-python = "==3.14.8"
dependencies = [
  "authlib==1.7.1",
  "fastapi==0.136.1",
  "httpx==0.28.1",
  "httpx-sse==0.4.1",
  "mcp==2.2.0",
  "openai==1.109.0",
  "requests==2.33.1",
  "uvicorn==0.37.0",
]

[project.optional-dependencies]
strongdm = ["strongdm==17.8.0"]

[dependency-groups]
dev = ["pytest==9.0.3", "pytest-asyncio==1.3.0", "coverage==7.10.7"]
test = [
  "authlib==1.7.1",
  "fastapi==0.136.1",
  "httpx==0.28.1",
  "httpx-sse==0.4.1",
  "mcp==2.2.0",
  "openai==1.109.0",
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "requests==2.33.1",
]
