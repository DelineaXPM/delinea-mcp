[project]
name = "delinea-mcp"
version = "1.2.0"
description = "MCP server for the Delinea Secret Server and Platform APIs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Delinea" }]
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.117.1",
  "httpx>=0.28.1",
  "httpx-sse>=0.4.1",
  "joserfc>=1.7.6",
  "mcp>=2.2.0,<3",
  "openai>=1.10.0",
  "requests>=2.32.4",
  "uvicorn>=0.35.0",
]

[project.urls]
Homepage = "https://github.com/DelineaXPM/delinea-mcp"
Repository = "https://github.com/DelineaXPM/delinea-mcp"

[project.scripts]
delinea-mcp = "server:run_server"

[project.optional-dependencies]
strongdm = ["strongdm>=17.8.0"]

[dependency-groups]
dev = ["pytest>=8.4.2", "pytest-asyncio>=1.1.0", "coverage>=7.6.9"]
test = [
  "fastapi>=0.117.1",
  "httpx>=0.28.1",
  "httpx-sse>=0.4.1",
  "joserfc>=1.7.6",
  "mcp>=2.2.0,<3",
  "openai>=1.10.0",
  "pytest>=8.4.2",
  "pytest-asyncio>=1.1.0",
  "requests>=2.32.4",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["delinea_mcp", "server.py", "delinea_api.py"]

[tool.hatch.build.targets.sdist]
only-include = [
  "delinea_mcp",
  "server.py",
  "delinea_api.py",
  "tests",
  "README.md",
  "LICENSE",
]
